syntax = "proto3";

package noti_bridge.v1;

// 알림 상태. 충돌 시 version 이 같으면 DISMISSED 가 우선한다.
enum NotificationState {
  NOTIFICATION_STATE_UNSPECIFIED = 0;
  NOTIFICATION_STATE_ACTIVE = 1;
  NOTIFICATION_STATE_DISMISSED = 2;
  NOTIFICATION_STATE_EXPIRED = 3;
}

// 본문이 숨겨진 이유. 받는 쪽이 사용자에게 무엇을 하면 볼 수 있는지 안내할 때 쓴다.
enum HiddenReason {
  HIDDEN_REASON_UNSPECIFIED = 0;
  // 원본 기기의 앱 규칙(본문 숨김, 은행 앱 기본값).
  HIDDEN_REASON_POLICY = 1;
  // OS 가 가려서 넘겨준 경우(Android 15 민감 알림 등).
  HIDDEN_REASON_SYSTEM = 2;
}

message NotificationAction {
  string id = 1;
  string title = 2;
  // 빠른 답장(Android RemoteInput) 입력을 받는 액션인지 여부.
  bool accepts_reply = 3;
}

message Notification {
  // 전역 ID = 원본 기기 ID + Android 알림 key.
  string nid = 1;
  string origin = 2;
  string app_pkg = 3;
  string app_name = 4;
  string icon_hash = 5;
  string title = 6;
  string body = 7;
  repeated NotificationAction actions = 8;
  NotificationState state = 9;
  // 변경마다 증가하는 Lamport 시계.
  uint64 version = 10;
  // 표시용 시각(유닉스 밀리초).
  int64 updated_at = 11;
  // 본문이 숨겨졌는지(민감 앱 정책 또는 OS 가림).
  bool body_hidden = 12;
  // 음악·동영상 재생처럼 계속 떠 있는 알림. 받는 쪽은 목록 위에 고정하고 팝업하지 않는다.
  bool ongoing = 13;
  HiddenReason hidden_reason = 14;
}

// 연결 직후 서로 어디까지 받았는지 교환한다.
message Hello {
  string device_id = 1;
  uint64 last_seen_seq = 2;
  // 연결 시점에 보낸 쪽 로그의 마지막 순번. 이 번호까지는 끊겨 있던 동안 쌓인 이벤트라
  // 받는 쪽이 소리·팝업 없이 반영한다. 이전 버전은 0 을 보낸다.
  uint64 head_seq = 3;
}

message Posted { Notification notification = 1; }
message Updated { Notification notification = 1; }
message Removed {
  string nid = 1;
  NotificationState state = 2;
  uint64 version = 3;
  int64 updated_at = 4;
}

message DismissRequest {
  string nid = 1;
  uint64 version = 2;
}
message ActionRequest {
  string nid = 1;
  string action_id = 2;
}
message ReplyRequest {
  string nid = 1;
  string action_id = 2;
  string text = 3;
}

message Ack { uint64 seq = 1; }

message IconBlob {
  string hash = 1;
  bytes png = 2;
}

// 방해 금지 모드 동기화.
message DndChanged {
  bool enabled = 1;
  uint64 version = 2;
}

// 이 기기 화면에서 숨기기·다시 보이기. 연결된 모든 기기가 같이 숨긴다(원본 OS 알림은 지우지 않는다).
message HideChanged {
  string nid = 1;
  bool hidden = 2;
  uint64 version = 3;
}

// 필터 하나. kind: 0 앱, 1 키워드, 2 내용 숨겨진 알림.
message FilterItem {
  uint32 kind = 1;
  string pattern = 2;
  // 화면에 보여 줄 이름(앱 필터의 앱 이름).
  string label = 3;
}

// 필터 목록 전체. updated_at 이 더 큰 쪽이 이긴다.
message FiltersChanged {
  repeated FilterItem items = 1;
  int64 updated_at = 2;
}

// 앱 규칙. policy: 0 허용, 1 차단, 2 본문 숨김. 그 앱의 알림을 캡처하는 기기가 적용한다.
message AppRuleChanged {
  string app_pkg = 1;
  uint32 policy = 2;
}

// 이벤트 로그에 쌓이는 항목. seq 는 송신 기기 기준 순번이다.
message LogEvent {
  uint64 seq = 1;
  oneof kind {
    Posted posted = 2;
    Updated updated = 3;
    Removed removed = 4;
    DismissRequest dismiss_request = 5;
    ActionRequest action_request = 6;
    ReplyRequest reply_request = 7;
    DndChanged dnd_changed = 8;
    HideChanged hide_changed = 9;
    FiltersChanged filters_changed = 10;
    AppRuleChanged app_rule_changed = 11;
  }
}

// 동기화 스트림의 프레임.
message Frame {
  oneof kind {
    Hello hello = 1;
    LogEvent event = 2;
    Ack ack = 3;
    IconBlob icon = 4;
  }
}

// 페어링 스트림의 프레임.
message PairRequest {
  string token = 1;
  string device_id = 2;
  string device_name = 3;
  string platform = 4;
  // 재연결용 주소 힌트.
  string relay_url = 5;
  repeated string addrs = 6;
}
message PairAccepted {
  string device_id = 1;
  string device_name = 2;
  string platform = 3;
  string relay_url = 4;
  repeated string addrs = 5;
}
message PairConfirm { bool accepted = 1; }
message PairFrame {
  oneof kind {
    PairRequest request = 1;
    PairAccepted accepted = 2;
    PairConfirm confirm = 3;
  }
}
