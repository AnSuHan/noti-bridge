[package]
name = "noti-bridge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
ffi = ["dep:uniffi"]

[dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.3"
hex = "0.4"
iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
percent-encoding = "2"
prost = "0.14"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
tokio = { workspace = true }
tokio-util = "0.7"
tracing = "0.1"
uniffi = { workspace = true, optional = true }

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "signal"] }
